version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TARGET_SITE_URL=${TARGET_SITE_URL}
    depends_on:
      - redis
    deploy:
      replicas: 5 # Scale this to match your needed concurrency

volumes:
  redis_data:
